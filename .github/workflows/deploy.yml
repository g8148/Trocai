name: Deploy para VPS (main)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          script: |
            bash /opt/Trocai/deploy.sh

      - name: Verificar saúde dos serviços
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            systemctl is-active trocai-api || (echo "ERRO: trocai-api nao esta rodando" && exit 1)
            systemctl is-active trocai-web || (echo "ERRO: trocai-web nao esta rodando" && exit 1)
            curl -sf http://localhost:8000/admin/ -o /dev/null && echo "API OK"
            curl -sf http://localhost:3002/ -o /dev/null && echo "Web OK"
