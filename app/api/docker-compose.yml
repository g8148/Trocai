services:
  db:
    image: postgres:18.3
    container_name: trocai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trocai
      POSTGRES_USER: trocai
      POSTGRES_PASSWORD: trocai_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trocai -d trocai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
