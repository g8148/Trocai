services:
  db:
    image: postgres:18.3
    container_name: trocai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trocai
      POSTGRES_USER: trocai
      POSTGRES_PASSWORD: trocai_dev_2026
    # Bind em 127.0.0.1: o banco so aceita conexoes da propria maquina.
    # A porta do host vem do DB_PORT do .env (o compose le o .env deste
    # diretorio), com 5432 como padrao. Na VPS ela e 7510, porque a 5432
    # ja esta ocupada por outro projeto na mesma maquina.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trocai -d trocai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
